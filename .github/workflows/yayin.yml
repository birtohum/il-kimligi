name: Haftalık güncelleme ve yayın
on:
  schedule:
    - cron: "40 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  yayin:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.y.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sayıları sitelerden yeniden derle
        if: github.event_name == 'schedule'
        run: |
          python araclar/uret.py
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add site && git diff --cached --quiet || (git commit -m "Veri: $(date -u +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: y
        uses: actions/deploy-pages@v4
